<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <style>@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300&display=swap');</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./movie.png" type="image/x-icon">    
  <title>MovieFlix</title>
</head>
<body>
  <header>
    <div class="navbar">
        <div class="navbar-container">
    <h1 class="logo">MovieFlix</h1>
    <div class="menu-container">
        <ul class="nav-menu">
            <li class="nav-time"> <a href="#" class="nav-link">Home</a></li>
            <li class="nav-time"> <a href="#" class="nav-link">Movies</a></li>
            <li class="nav-time"> <a href="#" class="nav-link">Series</a></li>
            <li class="nav-time"> <a href="#" class="nav-link">Popular</a></li>
            <li class="nav-time"> <a href="#" class="nav-link">Trends</a></li>
         
        </ul>
        <!-- burger nav-->
         <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>

    </div>
    </div>
    </div>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search movies"> 
      
    </div>
    <button id="search-button">Search</button>
    <div class="filter-sort">
      <select id="genre-filter">
        <option value="">All Genres</option>
        <option value="28">Action</option>
        <option value="35">Comedy</option>
        <option value="18">Drama</option>
      </select>
      <select id="sort-by">
        <option value="popularity.desc">Popularity (descendent)</option>
        <option value="vote_average.desc">Rating (descendent)</option>
        <option value="release_date.desc">Release Date (descendent)</option>
      </select>
    </div>
    
  </header>
  <main>
    <div class="movie-list" id="movie-list"></div>

    <div class="modal" id="movie-modal">
      <div class="modal-content">
        <div id="modal-content"></div>
      </div>
    </div>
  </main>

  <footer>
        <hr>
        &copy; 2026 copyright reserved <br>
        <small>rkina@umich.edu</small>
  </footer>
  <script src="index.js"></script>
</body>
</html>
